<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario validate</title>

    <link rel="shortcut icon" href="./public/img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="./public/img/favicon.ico" type="image/x-icon">
    <!-- <link rel="stylesheet" href="./public/vendor/bootstrap-5.0.2-dist/css/bootstrap-grid.min.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <header>
        <form class="row g-3" method="get" action="server.html">
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Email</label>
                <input 
                    type="email" 
                    class="form-control" 
                    id="inputEmail4" 
                    required
                    value="abjs@gmail.com"
                >
            </div>

            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Password</label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="inputPassword4"
                    required
                    pattern="([a-z]{1})([A-Z]{2})"
                    value="aDV"
                >
            </div>

            <div class="col-12">
                <label for="inputAddress" class="form-label">Direccion</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="inputAddress" 
                    placeholder="1234 calle principal"
                    maxlength="40"
                >
            </div>
            <div class="col-12">
                <label for="inputAddress2" class="form-label">Direccion 2</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="inputAddress2" 
                    placeholder="Apartamento, Casa N"
                >
            </div>
            <div class="col-md-6">
                <label for="inputCity" class="form-label">Ciudad</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="inputCity"
                    pattern="([0-9]{1})([A-Z]{3})(-)([a-z]{3}([0-9]{3})-([A-Z]{2}))"
                >
            </div>
            <div class="col-md-4">
                <label for="inputState" class="form-label">State</label>
                <select id="inputState" class="form-select">
                    <option selected>Choose...</option>
                    <option>...</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="inputZip" class="form-label">Zip</label>
                <input type="text" class="form-control" id="inputZip">
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        Check me out
                    </label>
                </div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
        </form>
        
    </header>
    <main>
 
    </main>
    <footer>

    </footer>

    <script src="./public/vendor/bootstrap-5.0.2-dist/js/bootstrap.min.js"></script>
</body>
</html>
